server:
  port: 8080

spring:
  application:
    name: api-gateway

  security:
    oauth2:
      client:
        provider:
          keycloak:
            authorization-uri: ${KC_PUBLIC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}/protocol/openid-connect/auth
            token-uri: ${KC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}/protocol/openid-connect/token
            jwk-set-uri: ${KC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}/protocol/openid-connect/certs
            user-info-uri: ${KC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}/protocol/openid-connect/userinfo
            user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway-client
            client-secret: ${GATEWAY_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      resourceserver:
        jwt:
          issuer-uri: ${KC_PUBLIC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}
          jwk-set-uri: ${KC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}/protocol/openid-connect/certs

  cloud:
    gateway:
      discovery:
        locator:
          lower-case-service-id: true
      server:
        webflux:
          routes:
            - id: flow-manager-route
              uri: lb://flow-manager
              predicates:
                - Path=/flow/**
              filters:
                - StripPrefix=1
                - name: RequestSize
                  args:
                    size: 2GB


eureka:
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${HOSTNAME:${server.port}}
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
    registry-fetch-interval-seconds: 5
    healthcheck:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health