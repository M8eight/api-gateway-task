server:
  port: 8080

spring:
  application:
    name: api-gateway
  codec:
    max-in-memory-size: 1000MB

  security:
    oauth2:
      client:
        provider:
            keycloak:
              issuer-uri: ${KC_PUBLIC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}
              user-name-attribute: preferred_username
        registration:
          keycloak:
            provider: keycloak
            client-id: gateway-client
            client-secret: eOzXa2PnQgj41iFhFnzyWn6YNRy5WveO
            authorization-grant-type: authorization_code
            scope:
              - openid
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
      resourceserver:
        jwt:
          issuer-uri: ${KC_PUBLIC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}
          jwk-set-uri: ${KC_URL:http://localhost:9090}/realms/${KC_REALM:converter-realm}/protocol/openid-connect/certs

  cloud:
    gateway:
      discovery:
        locator:
          lower-case-service-id: true
      server:
        webflux:
          routes:
            - id: flow-manager-route
              uri: lb://flow-manager
              predicates:
                - Path=/flow/**
              filters:
                - StripPrefix=1


eureka:
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    instance-id: ${spring.application.name}:${server.port}
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    registry-fetch-interval-seconds: 5